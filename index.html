{padding:19px;margin-bottom:14px;min-width:0}.widget{min-height:250px;display:flex;flex-direction:column;gap:12px;margin-bottom:0}.whead{display:flex;justify-content:space-between;align-items:flex-start}.whead p{font-size:12px}.dots{color:#ad9ab9;letter-spacing:1px}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.monthbar b{font-size:13px}.icon-btn{border:1px solid #332a3e;background:#221a2a;border-radius:8px;padding:2px 9px;font-size:20px}.weekdays,.monthdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.weekdays{font-size:10px;color:#a79bb2}.day{min-height:24px;padding:2px 0;font-size:11px;background:#15101e;border:1px solid #33273d;border-radius:8px;position:relative}.day i{display:block;width:4px;height:4px;background:#ad91ff;border-radius:99px;position:absolute;bottom:1px;left:calc(50% - 2px)}.day.todayday{background:#604575;border-color:#b28bff}.day.blank{background:none;border:0}.inspiration{text-align:center}.inspiration .whead{text-align:left}.orb{height:54px;width:54px;margin:5px auto;border:3px solid #654c99;border-radius:50%;box-shadow:0 0 22px #654ab867,inset 0 0 20px #8b49c75c;display:grid;place-items:center;color:#ceabff;font-size:23px}.inspiration blockquote{font-style:italic;font-weight:650;max-width:250px;margin:3px auto;line-height:1.8}.subtle-btn{background:none;border:0;color:#c7aaf3;text-align:left;font-size:12px;padding:6px 0;margin-top:auto}.inspiration .subtle-btn{text-align:center}.vision{background:radial-gradient(ellipse at 60% 80%,#8165aa 0,transparent 55%),linear-gradient(155deg,#251e3b,#151923 70%);border:1px solid #483956;border-radius:16px;height:155px;position:relative;overflow:hidden;padding:19px;display:flex;flex-direction:column;justify-content:end;gap:9px}.vision:after{content:'';position:absolute;right:-25px;top:18px;width:140px;height:140px;border:1px solid #a888ef72;border-radius:50%;box-shadow:0 0 0 20px #8e73bc18,0 0 0 46px #9074ad18}.vision span{font-size:10px;letter-spacing:2px;color:#d1b8eb}.vision strong{font-size:15px;max-width:230px;line-height:1.35;z-index:1}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.linkwrap{position:relative;min-width:0}.linkchip{display:block;text-decoration:none;color:#ded2e8;background:#241a2e;border:1px solid #322640;padding:9px 20px 9px 9px;border-radius:9px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.linkremove{position:absolute;right:4px;top:5px;background:transparent;border:0;color:#83728f}.wide-dash{border:1px dashed #51415e;background:#201829;border-radius:10px;padding:9px;color:#a891b9;margin-top:auto}.habittiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.habittile{text-align:center;padding:11px 4px;background:#140f1c;border:1px solid #292031;border-radius:12px;min-height:81px;display:flex;align-items:center;flex-direction:column;gap:3px}.habittile strong{color:#c5ade5}.habittile span{font-size:11px;line-height:1.2;overflow-wrap:anywhere}.habittile small{font-size:9px;color:#877b94}.habittile.checked{border-color:#9773cc;background:#2d1e3e}.focuswide{grid-column:span 2}.focuscolumns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.focuspanel{background:#17111e;border:1px solid #35283e;border-radius:18px;padding:15px;display:grid;gap:9px}.focuslabel{color:#bfb0ce;font-size:11px;font-weight:700;margin-bottom:2px}.priorityline{display:flex;align-items:center;gap:9px}.priorityline span{background:#382a49;border-radius:8px;padding:5px 10px;font-size:12px;color:#c8abef}.priorityline input{border:1px solid #392b43;background:#120e19;border-radius:9px;width:100%;min-width:0;color:#eee5f6;padding:9px;outline:0}.priorityline input:focus{border-color:#a987ec}.timer{font-size:38px;letter-spacing:1px;font-weight:780;text-align:center;font-variant-numeric:tabular-nums}.timeractions{display:flex;justify-content:center;gap:8px}.focusminitasks{display:grid;gap:8px}.minitask{display:flex;gap:8px;align-items:center;font-size:12px}.minirow{border-bottom:1px solid #302539;padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:9px}.minirow b{font-size:12px}.metricbig{font-size:35px;font-weight:800;color:#d6bdff}.metricbig small{font-size:12px;color:#a999b7;font-weight:400}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{font-size:26px;display:block;margin-top:8px}.stat em{font-size:11px;color:#c4a8f4;font-style:normal}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card-header{display:flex;align-items:center;justify-content:space-between}.muted{color:var(--muted)}.tiny{font-size:12px}.accent{color:var(--accent2)}.action{background:#7f59bb;border:1px solid #926ccc;color:white;border-radius:10px;padding:10px 13px;font-weight:650}.action.secondary{background:#39294d;border-color:#59416e}.action.ghost{background:transparent;border-color:#493552;color:#bbabca}.inline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stack{display:grid;gap:8px}.item{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #382b40;border-radius:11px;background:#16101d;min-width:0}.item label{flex:1;overflow-wrap:anywhere}.item.done label{text-decoration:line-through;color:#867b91}.item input[type=checkbox],.minitask input{accent-color:#b689ee;width:16px;height:16px}.item button{background:none;border:0;color:#a48caf;font-size:18px}.input{width:100%;min-width:0;border:1px solid #493657;background:#130e1a;border-radius:10px;padding:10px;color:#f8efff}.input:focus{outline:1px solid #ac86e1}.formline{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.formline>*:first-child{flex:1}.formline .input{flex:1;min-width:120px}.split,.three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}td{font-variant-numeric:tabular-nums}.positive{color:#8ee0bf}.negative{color:var(--red)}.meter{height:8px;background:#31243a;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#784fb4,#c49af1)}.barrow{display:flex;justify-content:space-between}.hint{font-size:11px;color:var(--muted);margin-top:auto}.empty{border:1px dashed #4a3855;border-radius:12px;padding:20px;text-align:center;color:#a99ab5}.tag{background:#342344;border-radius:8px;color:#c7a8f2;font-size:11px;padding:4px 7px}.toast{position:fixed;bottom:20px;right:20px;border-radius:12px;background:#5b367d;color:white;padding:12px 17px;display:none;z-index:3}.utility{display:flex;gap:7px;align-items:center;margin-left:auto}.utility button,.utility label{font-size:11px;background:#251a31;border:1px solid #453352;border-radius:9px;padding:8px 10px;cursor:pointer;color:#cfc0db}.utility input{display:none}@media(max-width:1200px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.focuswide{grid-column:span 2}.sidebar{gap:12px}.utility{width:100%;justify-content:flex-end}}@media(max-width:700px){.sidebar{padding:13px}.nav{order:3;width:100%;flex-basis:100%}.nav button{font-size:12px}.main{padding:17px 12px 50px}.dashboard-grid{grid-template-columns:1fr}.focuswide{grid-column:span 1}.focuscolumns,.grid,.three{grid-template-columns:1fr}.top{align-items:flex-start}.topright{display:none}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.widget{min-height:230px}.habittiles{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="shell"><header class="sidebar"><div><div class="brand">LIFE<span>OS</span> ✦</div><div class="subbrand">YOUR PERSONAL COMMAND CENTER</div></div><nav class="nav" id="nav"></nav><div class="utility"><button onclick="exportData()" title="Download a backup">↓ Backup</button><label title="Restore from a backup">↑ Restore<input type="file" accept="application/json" onchange="importData(this)"></label></div></header><main class="main"><div class="top"><div><div class="eyebrow">MAKE TODAY COUNT · YOUR COMMAND CENTER</div><h1 id="pageTitle">Hello, CEO ✦</h1><p id="pageDesc">Own your day. Build your future.</p></div><div class="topright"><span class="pill" id="dateLabel"></span><button aria-label="Your settings" onclick="alert('Your data is saved in this browser. Use Backup and Restore to move it. Cloud sync is the next deployment step.')">⚙</button></div></div><div id="content"></div></main></div><div class="toast" id="toast"></div><script>
const sections=[['today','◈','Today','Your daily command center.'],['fitness','◉','Fitness','Train smarter and track your recovery.'],['finance','▤','Finances & Stocks','Manage money and monitor investments.'],['faith','✦','Faith','Bible reading, prayer, and spiritual growth.'],['career','⌘','Career & Learning','Grow your skills and move toward bigger opportunities.'],['habits','◷','Habits & Discipline','Build consistency, one day at a time.'],['goals','◎','Goals & Reviews','Turn long-term objectives into progress.']];
const todayKey=()=>new Date().toLocaleDateString('en-CA');
const defaults={tasks:[],habits:[{id:'h1',name:'Bible reading',history:{}},{id:'h2',name:'Workout or active recovery',history:{}},{id:'h3',name:'Deep work / study',history:{}},{id:'h4',name:'Morning routine',history:{}}],workouts:[],weight:[],prayers:[],readings:[],skills:[],goals:[],budget:[],stocks:[],journal:[],focusMinutes:0};
let data;try{data={...structuredClone(defaults),...JSON.parse(localStorage.getItem('lifeos-v1')||'{}')}}catch{data=structuredClone(defaults)};
const save=()=>localStorage.setItem('lifeos-v1',JSON.stringify(data));const h=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(n)||0);const uid=()=>Math.random().toString(36).slice(2,10);let current='today';let monthOffset=0,quoteShift=0,timerSeconds=25*60,timerRunning=false,timerHandle=null;
const habitsDone=()=>data.habits.filter(x=>x.history?.[todayKey()]).length;const tasksDone=()=>data.tasks.filter(x=>x.done).length;const percent=(a,b)=>b?Math.round(100*a/b):0;
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function add(form,kind,fields){const values=Object.fromEntries(fields.map(name=>[name,form.elements[name].value.trim()]));if(Object.values(values).some(v=>!v)){toast('Please fill in all fields');return}let o={id:uid(),...values,date:todayKey()};if(kind==='tasks')o.done=false;if(kind==='habits')o.history={};if(kind==='stocks'){for(let k of ['shares','cost','price'])o[k]=Number(o[k]);if(Object.values({shares:o.shares,cost:o.cost,price:o.price}).some(v=>!Number.isFinite(v)||v<0)){toast('Enter valid nonnegative prices and shares');return}}data[kind].unshift(o);save();render()}
function remove(kind,id){data[kind]=data[kind].filter(x=>x.id!==id);save();render()};function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()};function toggleHabit(id){let t=data.habits.find(x=>x.id===id);if(t){t.history??={};t.history[todayKey()]=!t.history[todayKey()]}save();render()}
const empty=s=>`<div class="empty">${s}</div>`;const form=(kind,fields,labels,button='Add')=>`<form class="formline" onsubmit="event.preventDefault();add(this,'${kind}',${JSON.stringify(fields).replaceAll('"','&quot;')})">${fields.map((x,i)=>`<input class="input" name="${x}" ${['cost','shares','price'].includes(x)?'type="number" min="0" step="any"':'type="text"'} placeholder="${labels[i]}" aria-label="${labels[i]}" required>`).join('')}<button class="action">${button}</button></form>`;
function items(kind,field='name'){return data[kind].length?data[kind].map(x=>`<div class="item"><label><b>${h(x[field])}</b>${x.detail?`<div class="muted tiny">${h(x.detail)}</div>`:''}${x.date?`<div class="muted tiny">${h(x.date)}</div>`:''}</label><button title="Delete entry" onclick="remove('${kind}','${x.id}')">×</button></div>`).join(''):empty('No entries yet. Add your first one above.')}
function tasks(limit=false){let arr=limit?data.tasks.slice(0,6):data.tasks;return arr.length?arr.map(x=>`<div class="item ${x.done?'done':''}"><input aria-label="Complete task" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><label>${h(x.name)}</label><button title="Delete task" onclick="remove('tasks','${x.id}')">×</button></div>`).join(''):empty('Your task list is clear. Add a priority.')}
function habitCards(){return data.habits.length?data.habits.map(x=>`<div class="item ${x.history?.[todayKey()]?'done':''}"><input type="checkbox" aria-label="Complete habit" ${x.history?.[todayKey()]?'checked':''} onchange="toggleHabit('${x.id}')"><label>${h(x.name)}</label><span class="tag">${Object.values(x.history||{}).filter(Boolean).length} total</span><button title="Remove habit" onclick="remove('habits','${x.id}')">×</button></div>`).join(''):empty('Add a daily habit to start tracking.')}
function stats(arr){return `<div class="stats">${arr.map(([name,val,note])=>`<div class="stat"><small>${name}</small><strong>${val}</strong><em>${note||' '}</em></div>`).join('')}</div>`}
function today(){const d=new Date(),mt=new Date(d.getFullYear(),monthOffset,1),first=new Date(mt.getFullYear(),mt.getMonth(),1),days=new Date(mt.getFullYear(),mt.getMonth()+1,0).getDate(),skip=(first.getDay()+6)%7;const quotes=['You don’t have to be great to start, but you have to start to be great.','Discipline is choosing what you want most over what you want now.','Small steps every day become extraordinary results.','The secret of getting ahead is getting started.'];const td=todayKey();let invested=data.stocks.reduce((s,x)=>s+x.shares*x.cost,0),val=data.stocks.reduce((s,x)=>s+x.shares*x.price,0);let top=(data.top3||['','','']);let week=(data.week3||['','','']);let focusTasks=data.tasks.filter(x=>!x.done).slice(0,4);let calendar=Array.from({length:Math.ceil((skip+days)/7)*7},(_,i)=>{let day=i-skip+1;if(day<1||day>days)return '<span class="day blank"></span>';let key=`${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let count=data.habits.filter(x=>x.history?.[key]).length;return `<button class="day ${key===td?'todayday':''}" title="${count} habits completed" onclick="calendarClick('${key}')">${day}${count?'<i></i>':''}</button>`}).join('');return `<div class="dashboard-grid"><section class="card widget"><div class="whead"><div><h2>Monthly Grid</h2><p>This month at a glance</p></div><span class="dots">⠿</span></div><div class="monthbar"><button class="icon-btn" onclick="changeMonth(-1)">‹</button><b>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</b><button class="icon-btn" onclick="changeMonth(1)">›</button></div><div class="weekdays">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="monthdays">${calendar}</div><p class="hint">Dots indicate a completed habit</p></section>
<section class="card widget inspiration"><div class="whead"><div><h2>Daily Inspiration</h2><p>A little encouragement</p></div><span class="dots">⠿</span></div><div class="orb">✦</div><blockquote>“${quotes[d.getDate()%quotes.length]}”</blockquote><button class="subtle-btn" onclick="nextQuote()">New inspiration ↻</button></section>
<section class="card widget"><div class="whead"><div><h2>Vision Board</h2><p>Keep your why in sight</p></div><span class="dots">⠿</span></div><div class="vision"><div class="vision-glow"></div><span>YOUR FUTURE IS BUILT TODAY</span><strong>${h(data.vision||'Build a life of purpose, strength and freedom.')}</strong></div><button class="subtle-btn" onclick="editVision()">✎ Edit your vision</button></section>
<section class="card widget"><div class="whead"><div><h2>Favorite Links</h2><p>Your quick access shortcuts</p></div><span class="dots">⠿</span></div><div class="links">${(data.links||[{name:'ChatGPT',url:'https://chatgpt.com'},{name:'Google Calendar',url:'https://calendar.google.com'},{name:'GitHub',url:'https://github.com'},{name:'Supabase',url:'https://supabase.com/dashboard'}]).map((x,i)=>`<div class="linkwrap"><a class="linkchip" href="${h(x.url)}" target="_blank" rel="noopener noreferrer">↗ ${h(x.name)}</a><button class="linkremove" aria-label="Remove link" onclick="removeLink(${i})">×</button></div>`).join('')}</div><button class="wide-dash" onclick="addLink()">＋ Add Link</button></section>
<section class="card widget"><div class="whead"><div><h2>Habit Streaks</h2><p>Consistency tracker</p></div><span class="dots">⠿</span></div><div class="habittiles">${data.habits.slice(0,8).map(x=>{let hist=x.history||{};let n=0,cur=new Date();if(!hist[td])cur.setDate(cur.getDate()-1);for(let i=0;i<365;i++){let key=cur.toLocaleDateString('en-CA');if(!hist[key])break;n++;cur.setDate(cur.getDate()-1)}return `<button class="habittile ${hist[td]?'checked':''}" onclick="toggleHabit('${x.id}')"><strong>♨ ${n}</strong><span>${h(x.name)}</span><small>${hist[td]?'✓ Done today':'Tap to check off'}</small></button>`}).join('')}</div><button class="subtle-btn" onclick="select('habits')">Manage all habits →</button></section>
<section class="card widget focuswide"><div class="whead"><div><h2>High-Level Focus</h2><p>Your daily and weekly priorities</p></div><span class="dots">⠿</span></div><div class="focuscolumns"><div class="focuspanel"><div class="focuslabel">◎ TOP 3 TODAY</div>${top.map((x,i)=>`<div class="priorityline"><span>${i+1}</span><input aria-label="Today priority ${i+1}" placeholder="Priority ${i+1}" value="${h(x)}" onchange="setPriority('top3',${i},this.value)"></div>`).join('')}</div><div class="focuspanel"><div class="focuslabel">▣ TOP 3 THIS WEEK</div>${week.map((x,i)=>`<div class="priorityline"><span>${i+1}</span><input aria-label="Weekly priority ${i+1}" placeholder="Weekly priority ${i+1}" value="${h(x)}" onchange="setPriority('week3',${i},this.value)"></div>`).join('')}</div></div><p class="hint">Priorities are saved automatically when you finish editing.</p></section>
<section class="card widget"><div class="whead"><div><h2>Focus Mode</h2><p>Today's execution</p></div><span class="dots">⠿</span></div><div class="timer" id="timertext">${formatTimer(timerSeconds)}</div><div class="timeractions"><button class="action" onclick="toggleTimer()" id="timerbtn">${timerRunning?'Pause':'Start focus'}</button><button class="action ghost" onclick="resetTimer()">Reset</button></div><div class="tiny muted" style="margin:12px 0">${data.focusMinutes} total focused minutes logged</div><div class="focusminitasks">${focusTasks.map(x=>`<div class="minitask"><input type="checkbox" onchange="toggleTask('${x.id}')"><span>${h(x.name)}</span></div>`).join('')||'<p class="tiny muted">Add a task below to focus on.</p>'}</div><button class="subtle-btn" onclick="addFocus(25)">Log a completed 25-minute session +</button></section>
<section class="card widget"><div class="whead"><div><h2>My Goals</h2><p>Your bigger picture</p></div><span class="dots">⠿</span></div>${data.goals.slice(0,3).map(x=>`<div class="minirow"><span class="tag">${h(x.category)}</span><b>${h(x.name)}</b></div>`).join('')||'<div class="empty">Your goals will appear here.</div>'}<button class="subtle-btn" onclick="select('goals')">View all goals →</button></section>
<section class="card widget"><div class="whead"><div><h2>CEO Radar</h2><p>Today's calendar overview</p></div><span class="dots">⠿</span></div><div class="minirow"><span>✓</span><b>${tasksDone()} / ${data.tasks.length} tasks completed</b></div><div class="minirow"><span>♨</span><b>${habitsDone()} / ${data.habits.length} habits completed</b></div><div class="minirow"><span>◷</span><b>${data.focusMinutes} minutes of focused work</b></div><div class="tiny muted" style="margin-top:20px">Calendar sync comes after cloud setup.</div></section>
<section class="card widget"><div class="whead"><div><h2>Daily Briefing</h2><p>Your progress, at a glance</p></div><span class="dots">⠿</span></div><div class="metricbig">${percent(tasksDone()+habitsDone(),data.tasks.length+data.habits.length)}% <small>daily execution</small></div><div class="meter"><div class="fill" style="width:${percent(tasksDone()+habitsDone(),data.tasks.length+data.habits.length)}%"></div></div><div class="minirow"><span>Portfolio (manual)</span><b>${money(val)}</b></div><div class="minirow"><span>Workout logs</span><b>${data.workouts.length}</b></div><button class="subtle-btn" onclick="select('finance')">Open financial overview →</button></section>
<section class="card widget"><div class="whead"><div><h2>Inbox</h2><p>Tasks to process</p></div><span class="dots">⠿</span></div>${form('tasks',['name'],['Add a task...'],'Add')}<div class="stack">${tasks(true)}</div></section>
<section class="card widget"><div class="whead"><div><h2>Reflection</h2><p>Close your day with intention</p></div><span class="dots">⠿</span></div><form onsubmit="event.preventDefault();add(this,'journal',['name'])"><textarea class="input" name="name" rows="3" placeholder="What went well today?" required></textarea><button class="action" style="margin-top:10px">Save reflection</button></form>${data.journal.slice(0,2).map(x=>`<div class="minirow"><span class="tiny">${h(x.name)}</span><button class="action ghost" onclick="remove('journal','${x.id}')">×</button></div>`).join('')}</section></div>`}
function addFocus(n){data.focusMinutes+=n;save();render()}function resetFocus(){data.focusMinutes=0;save();render()}
function fitness(){return `${stats([['Workouts logged',data.workouts.length,'All-time entries'],['Weight entries',data.weight.length,'Manual log'],['Latest weight',data.weight[0]?h(data.weight[0].name):'—','Use your preferred unit'],['Training focus','Strength','Customize in your log']])}<div class="grid"><section class="card"><h2>Workout log</h2>${form('workouts',['name','detail'],['Workout name / day','Exercises, sets, or notes'])}<div class="stack">${items('workouts')}</div></section><section class="card"><h2>Body weight tracker</h2>${form('weight',['name'],['Weight and unit, e.g. 185 lb'])}<div class="stack">${items('weight')}</div></section></div>`}
function finance(){let invested=data.stocks.reduce((s,x)=>s+x.shares*x.cost,0),currentValue=data.stocks.reduce((s,x)=>s+x.shares*x.price,0),pnl=currentValue-invested;let spent=data.budget.reduce((s,x)=>s+(Number(x.amount)||0),0);return `<div class="card" style="border-color:#2a4c62"><div class="inline"><span class="tag">MANUAL PRICE TRACKING</span><span class="tiny muted">No brokerage connection or live market feed in v0.1. Enter prices yourself; values are estimates based on your inputs.</span></div></div>${stats([['Portfolio value',money(currentValue),'Based on entered prices'],['Unrealized P/L',money(pnl),invested?((pnl/invested)*100).toFixed(1)+'%':'No positions'],['Total cost basis',money(invested),'Shares × avg cost'],['Expenses logged',money(spent),'Manual entries']])}<section class="card"><h2>Stock & ETF watchlist / positions</h2><p class="tiny">Add your positions to calculate portfolio value and unrealized gains. Prices are not automatically refreshed.</p>${form('stocks',['ticker','shares','cost','price'],['Ticker, e.g. VOO','Shares','Avg cost / share','Current price / share'],'Add stock')}<div class="tablewrap"><table><thead><tr><th>Ticker</th><th>Shares</th><th>Cost basis</th><th>Market value*</th><th>Unrealized P/L</th><th></th></tr></thead><tbody>${data.stocks.map(x=>{let gain=x.shares*(x.price-x.cost);return `<tr><td><strong>${h(x.ticker.toUpperCase())}</strong></td><td>${x.shares}</td><td>${money(x.shares*x.cost)}</td><td>${money(x.shares*x.price)}</td><td class="${gain>=0?'positive':'negative'}">${money(gain)}</td><td><button class="action ghost" onclick="editPrice('${x.id}')">Price</button> <button class="action ghost" onclick="remove('stocks','${x.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No stocks added yet.</td></tr>'}</tbody></table></div><p class="hint">*Manual share-price entries; no real-time data, dividend adjustments, or realized P/L calculations.</p></section><div class="grid"><section class="card"><h2>Expense log</h2>${form('budget',['name','amount'],['Expense name / category','Amount ($)'])}<div class="stack">${data.budget.length?data.budget.map(x=>`<div class="item"><label>${h(x.name)} <span class="tiny muted">${h(x.date)}</span></label><strong>${money(x.amount)}</strong><button onclick="remove('budget','${x.id}')">×</button></div>`).join(''):empty('No expenses logged.')}</div></section><section class="card"><h2>Next financial features</h2><p>Budget categories, monthly cash-flow charts, savings milestones, dividends, and optional read-only market data and brokerage connections.</p><div class="meter"><div class="fill" style="width:30%"></div></div><p class="tiny">Start by tracking your holdings and spending manually.</p></section></div>`}
function editPrice(id){let s=data.stocks.find(x=>x.id===id);if(!s)return;let v=prompt('Enter the latest manual price for '+s.ticker,s.price);if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<0||v.trim()===''){toast('Invalid price');return}s.price=n;save();render()}
function faith(){return `${stats([['Scripture notes',data.readings.length,'Reading log'],['Prayer entries',data.prayers.length,'Journal'],['Daily reading',data.habits.find(x=>x.name==='Bible reading')?.history?.[todayKey()]?'Done':'Not checked','From Habits'],['Focus','Consistency','Stay grounded']])}<div class="grid"><section class="card"><h2>Bible reading & sermon notes</h2>${form('readings',['name','detail'],['Book and passage','Reflection or sermon insight'])}<div class="stack">${items('readings')}</div></section><section class="card"><h2>Prayer & gratitude journal</h2>${form('prayers',['name'],['Prayer, intention, or gratitude'])}<div class="stack">${items('prayers')}</div></section></div>`}
function career(){return `${stats([['Learning logs',data.skills.length,'Skills and projects'],['Career goals',data.goals.filter(x=>x.category==='Career').length,'Goal entries'],['Current focus','Growth','Log learning consistently'],['Next step','Build','One skill at a time']])}<section class="card"><h2>Career and learning tracker</h2><p class="tiny">Track cybersecurity, cloud, engineering, certifications, interview preparation, and projects.</p>${form('skills',['name','detail'],['Skill, course, certification, or project','Progress / next milestone'])}<div class="stack">${items('skills')}</div></section>`}
function habits(){return `${stats([['Active habits',data.habits.length,'Current checklist'],['Completed today',habitsDone(),'Daily progress'],['Consistency',percent(habitsDone(),data.habits.length)+'%','Today'],['Tracked days',new Set(data.habits.flatMap(x=>Object.keys(x.history||{}).filter(k=>x.history[k]))).size,'With at least one completion']])}<section class="card"><h2>Daily disciplines</h2>${form('habits',['name'],['New daily habit'])}<div class="stack">${habitCards()}</div></section>`}
function goals(){return `${stats([['Active goals',data.goals.length,'Across life areas'],['Fitness goals',data.goals.filter(x=>x.category==='Fitness').length,'Long-term'],['Finance goals',data.goals.filter(x=>x.category==='Finance').length,'Long-term'],['Career goals',data.goals.filter(x=>x.category==='Career').length,'Long-term']])}<section class="card"><h2>Goals by life area</h2><form class="formline" onsubmit="event.preventDefault();add(this,'goals',['name','category','detail'])"><input class="input" name="name" placeholder="Goal name" required><select class="input" name="category"><option>Fitness</option><option>Finance</option><option>Faith</option><option>Career</option><option>Habits</option><option>Personal</option></select><input class="input" name="detail" placeholder="Target date / milestone" required><button class="action">Add goal</button></form><div class="stack">${data.goals.length?data.goals.map(x=>`<div class="item"><span class="tag">${h(x.category)}</span><label><b>${h(x.name)}</b><div class="tiny muted">${h(x.detail)}</div></label><button onclick="remove('goals','${x.id}')">×</button></div>`).join(''):empty('Define your first quarterly or long-term goal.')}</div></section><section class="card"><h2>Weekly review prompts</h2><div class="three">${['What moved forward this week?','What distracted me or slowed me down?','What are my top 3 priorities next week?'].map((s,i)=>`<div class="item"><label><span class="tag">0${i+1}</span><div style="margin-top:7px">${s}</div></label></div>`).join('')}</div></section>`}

function changeMonth(n){monthOffset+=n;render()}
function calendarClick(key){toast(key+' — check habit dots for completed routines')}
function nextQuote(){quoteShift++;const quotes=['You don’t have to be great to start, but you have to start to be great.','Discipline is choosing what you want most over what you want now.','Small steps every day become extraordinary results.','The secret of getting ahead is getting started.'];document.querySelector('.inspiration blockquote').textContent='“'+quotes[(new Date().getDate()+quoteShift)%quotes.length]+'”'}
function editVision(){const s=prompt('What vision are you working toward?',data.vision||'Build a life of purpose, strength and freedom.');if(s!==null){data.vision=s.trim();save();render()}}
function addLink(){const name=prompt('Link name');if(!name)return;let url=prompt('URL (https://...)');if(!url)return;try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw 0;data.links??=[{name:'ChatGPT',url:'https://chatgpt.com'},{name:'Google Calendar',url:'https://calendar.google.com'},{name:'GitHub',url:'https://github.com'},{name:'Supabase',url:'https://supabase.com/dashboard'}];data.links.push({name:name.trim(),url:u.href});save();render()}catch{toast('Enter a valid http or https URL')}}
function removeLink(i){data.links??=[{name:'ChatGPT',url:'https://chatgpt.com'},{name:'Google Calendar',url:'https://calendar.google.com'},{name:'GitHub',url:'https://github.com'},{name:'Supabase',url:'https://supabase.com/dashboard'}];data.links.splice(i,1);save();render()}
function setPriority(k,i,value){data[k]??=['','',''];data[k][i]=value;save();toast('Priority saved')}
function formatTimer(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function toggleTimer(){timerRunning=!timerRunning;if(timerRunning){timerHandle=setInterval(()=>{timerSeconds--;const e=document.getElementById('timertext');if(e)e.textContent=formatTimer(Math.max(0,timerSeconds));if(timerSeconds<=0){clearInterval(timerHandle);timerRunning=false;data.focusMinutes+=25;save();timerSeconds=25*60;render();toast('Focus session completed!')}} ,1000)}else clearInterval(timerHandle);const b=document.getElementById('timerbtn');if(b)b.textContent=timerRunning?'Pause':'Start focus'}
function resetTimer(){timerRunning=false;clearInterval(timerHandle);timerSeconds=25*60;render()}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-os-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);const fresh=x.data||x;if(!fresh||!Array.isArray(fresh.tasks)||!Array.isArray(fresh.habits))throw Error();if(!confirm('Replace dashboard data with this backup?'))return;data={...structuredClone(defaults),...fresh};save();render();toast('Backup restored')}catch{toast('Invalid Life OS backup')}};reader.readAsText(file)}

const views={today,fitness,finance,faith,career,habits,goals};function select(k){current=k;render();window.scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=sections.map(([id,icon,name])=>`<button class="${id===current?'active':''}" onclick="select('${id}')">${icon}&nbsp; ${name}</button>`).join('');let s=sections.find(x=>x[0]===current);document.getElementById('pageTitle').textContent=current==='today'?'Hello, CEO ✦':s[2];document.getElementById('pageDesc').textContent=current==='today'?'A great day is built one decision at a time.':s[3];document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});document.getElementById('content').innerHTML=views[current]()}render();
</script></body></html>
